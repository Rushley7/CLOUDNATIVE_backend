server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notificaciones-alertas-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": cl.duoc.notificaciones.messaging.event.AlertaPedidoEvent
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": "*"
  application:
    name: notificaciones
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 1

# Nombres centralizados (deben coincidir con los del servicio pedidos)
app:
  rabbit:
    exchange: pedidos.topic.exchange
    dlx: pedidos.dlx.exchange
    queue: notificaciones.queue
    dlq: notificaciones.dlq
    routing-key: pedido.creado
