spring.application.name=pedidos360-backend

# Perfil "local" carga application-local.properties automaticamente (no versionado, ver .gitignore)
# con las credenciales reales de RDS. No requiere variables de entorno ni configuracion del IDE.
spring.profiles.active=local

# Base de datos - valores por defecto (MySQL local); application-local.properties los sobreescribe
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:CLOUD_BACKEND}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Microsoft Entra ID - Validacion de JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/391cd481-8860-4baf-b334-f1720e604b50/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://f6c6a292-0ca4-48c1-aff9-133d0f76a624

# CORS - origen permitido para el frontend Angular (dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
